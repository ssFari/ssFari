<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc">
  <title id="title">Fari, the little listening screen</title>
  <desc id="desc">A small sleepy computer screen wears headphones beside a cup of tea, with a quiet record-shaped halo behind it.</desc>
  <defs>
    <pattern id="paper" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".45" fill="#789387" opacity=".17"/>
    </pattern>
    <clipPath id="frame"><rect width="560" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="560" height="320" fill="#eef1eb"/>
    <rect width="560" height="320" fill="url(#paper)"/>

    <!-- Record grooves give the portrait a quiet lo-fi rhythm. -->
    <circle cx="280" cy="151" r="118" fill="#dce6db"/>
    <circle cx="280" cy="151" r="95" fill="none" stroke="#c3d2c4" stroke-width="2"/>
    <circle cx="280" cy="151" r="79" fill="none" stroke="#c3d2c4" stroke-width="2"/>
    <path d="M54 278h452" stroke="#789387" stroke-width="3" stroke-linecap="round"/>

    <!-- The headphone band sits behind the monitor, with matching ear cups. -->
    <path d="M180 151v-10c0-63 43-99 100-99s100 36 100 99v10" fill="none" stroke="#334b47" stroke-width="12" stroke-linecap="round"/>
    <path d="M186 139v28m188-28v28" stroke="#789387" stroke-width="19" stroke-linecap="round"/>

    <!-- One clear silhouette: a soft-edged old computer with a sleepy face. -->
    <rect x="190" y="102" width="180" height="145" rx="18" fill="#f8f8f1" stroke="#334b47" stroke-width="5"/>
    <rect x="207" y="119" width="146" height="88" rx="10" fill="#49665e"/>
    <path d="M239 156q9 9 18 0m46 0q9 9 18 0" fill="none" stroke="#eaf0e4" stroke-width="4" stroke-linecap="round"/>
    <path d="M272 178q8 8 16 0" fill="none" stroke="#eaf0e4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="280" cy="226" r="4" fill="#789387"/>
    <path d="M263 248h34v19h-34z" fill="#c8d5c8" stroke="#334b47" stroke-width="4" stroke-linejoin="round"/>
    <path d="M239 268h82" stroke="#334b47" stroke-width="8" stroke-linecap="round"/>

    <!-- A mug stays separate from the character and rests on the same surface. -->
    <path d="M415 238h39l-4 39h-31z" fill="#f8f8f1" stroke="#49665e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M453 244h9c12 0 12 21-1 21h-8" fill="none" stroke="#49665e" stroke-width="4"/>
    <path d="M426 228c-5-5 3-9-1-14m15 14c-5-5 3-9-1-14" fill="none" stroke="#789387" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
